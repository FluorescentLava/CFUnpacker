[package]
name = "cfunpacker"
version = "2.0.0"
edition = "2024"
description = "Native Carrot Fantasy APK asset unpacker"
build = "build.rs"
default-run = "CFUnpacker"

[lib]
name = "cfunpacker"
path = "src/lib.rs"

[[bin]]
name = "cfunpacker-core"
path = "src/main.rs"

[[bin]]
name = "CFUnpacker"
path = "src/gui.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
ctrlc = "3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
plist = "1"
png = "0.17"
quick-xml = "0.42"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
naui-winui3 = "0.16"
windows = { version = "0.62", features = ["ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections", "Storage", "Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
windows-future = "0.3"
windows-collections = "0.3"


[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
